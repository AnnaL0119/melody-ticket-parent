server:
  port: 8083

spring:
  application:
    name: ticket-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8010
        port: 8719
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/melody_ticket?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 消息可靠性：publisher confirm + 无法路由时退回
    publisher-confirm-type: correlated
    publisher-returns: true
    mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # 重试耗尽后不 requeue，交给死信队列做库存回滚补偿
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Seata 分布式事务（通过 SEATA_ENABLED 开关控制）
seata:
  enabled: ${SEATA_ENABLED:false}

logging:
  level:
    com.melody.ticket: debug