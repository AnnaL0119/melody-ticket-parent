server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        enabled: false
    sentinel:
      transport:
        dashboard: localhost:8010
        port: 8719
      eager: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/melody_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Seata 分布式事务（通过 SEATA_ENABLED 开关控制）
seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: user-service
  tx-service-group: melody-ticket-group
  service:
    vgroup-mapping:
      melody-ticket-group: default
    grouplist:
      default: localhost:8091
  registry:
    type: file
  config:
    type: file

logging:
  level:
    com.melody.user: debug

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}